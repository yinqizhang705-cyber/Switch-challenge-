<script type="text/javascript">
    var result = [];

    function compareArray(a1, a2) {
        if (a1 === a2) return true;
        if ((!a1 && a2) || (a1 && !a2)) return false;
        if (a1.length !== a2.length) return false;
        for (var i = 0, n = a1.length; i < n; i++) {
            if (a1[i] !== a2[i]) return false;
        }
        return true;
    }

    function one_switch(start, ks, ki, end) {
        if (ki == ks.length) {
            return compareArray(start, end);
        }
        if (ks[ki] instanceof Array) {
            //     选项
            var selectList = ks[ki];
            for (var select of selectList) {
                var temp = JSON.parse(JSON.stringify(start));
                var numList = select.split("");
                if(numList.size ==0){
                    continue
                }
                for (var i = 0; i < numList.length; i++) {
                    var j = parseInt(numList[i]) - 1;
                    temp[i] = start[j];
                }
                if (one_switch(temp, ks, ki + 1, end)) {
                    result.push(select);
                    return true
                }
            }

        } else {
            // 非选项
            var temp = JSON.parse(JSON.stringify(start));
            var numList = ks[ki].split("");
            for (var i = 0; i < numList.length; i++) {
                var j = parseInt(numList[i]) - 1;
                temp[i] = start[j];
            }
            return one_switch(temp, ks, ki + 1, end);
        }
    }

    function clearInput() {
        document.getElementById("start1").value = "";
        document.getElementById("start2").value = "";
        document.getElementById("start3").value = "";
        document.getElementById("start4").value = "";
        document.getElementById("end1").value = "";
        document.getElementById("end2").value = "";
        document.getElementById("end3").value = "";
        document.getElementById("end4").value = "";
        document.getElementById("switch").value = "";
        document.getElementById("result").value = "";
    }

    function getResult() {
        result = [];
        document.getElementById("result").value = "";
        var start = [Number(document.getElementById("start1").value),
            Number(document.getElementById("start2").value),
            Number(document.getElementById("start3").value),
            Number(document.getElementById("start4").value)];

        var end = [Number(document.getElementById("end1").value),
            Number(document.getElementById("end2").value),
            Number(document.getElementById("end3").value),
            Number(document.getElementById("end4").value)];
        var ksStr = document.getElementById("switch").value.replaceAll("，",",");

        var ksStrList = ksStr.split('\n');

        // var end = [2, 4, 1, 3];
        // var ksStrList = ['1342,2341,2431', '1342'];

        var k_s = [];
        for (var i = 0; i < ksStrList.length; i++) {
            if (ksStrList[i].indexOf(",") != -1) {
                var ksStrItem = ksStrList[i].replace(/\s*/g,"")
                var selectStrList = ksStrItem.split(",");
                k_s.push(selectStrList);
            } else {
                k_s.push(ksStrList[i]);
            }
        }
        one_switch(start, k_s, 0, end);

        var output = "";
        if(result.length==0){
            output="请检查管道输入的数字是否正确";
        }
        for(var nums of result.reverse()){
            output += nums;
            output+="\n";
        }

        document.getElementById("result").value = output;

    }

    function goNextInput(el) {
            var delCount = 2;//用来判断删除时是第一次点击还是第二次
            var txts = document.querySelectorAll(el);
            for (var i = 0; i < txts.length; i++) {
                var t = txts[i];
                t.index = i;
                t.onkeyup = function () {
                    this.value = this.value.replace(/^(.).*$/, '$1');
                    var next = this.index + 1;
                    // 最后一个输入框
                    if (next == txts.length) {
                        if (this.value) {
                            delCount = 1//有值的时候把delCount变成1
                        } else {
                            if (delCount < 2) {
                                delCount++
                            } else {
                                if (next - 2 >= 0) {
                                    txts[next - 2].focus();
                                    txts[next - 2].value = '';
                                    delCount = 1
                                }
                            }
                        }
                    }
                    if (next > txts.length - 1) return;
                    if (this.value) {
                        delCount = 2
                        txts[next].focus();
                    }
                    else {
                        if (next - 2 >= 0) {
                            txts[next - 2].focus();
                            txts[next - 2].value = '';
                            delCount = 1
                        }
                    }
                }
            }
        }
        //调用该方法：
        goNextInput('.code-num');

    // 点击code输入框，判断谁聚焦
        function code_focus() {
            var txts = document.querySelectorAll('.code-num');
            for (var i = 0; i < txts.length; i++) {
                var t = txts[i];
                t.index = i;
                if (txts[0].value != '') {
                    if (txts[1].value != '') {
                        if (txts[2].value != '') {
                            if (txts[3].value != '') {
                                txts[3].focus();
                            } else {
                                txts[3].focus();
                            }
                        } else {
                            txts[2].focus();
                        }
                    } else {
                        txts[1].focus();
                    }
                } else {
                    txts[0].focus();
                }
            }
        }
</script>
